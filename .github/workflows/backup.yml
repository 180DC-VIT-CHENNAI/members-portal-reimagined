name: Backup to Backblaze B2

# Uses `rclone copy` (never `sync`) so objects written to B2 during an R2
# outage are not deleted.

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == '180DC-VIT-CHENNAI/members-portal-reimagined'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ee4c08f37c3a62fedc87fbd1b8b96ff4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://ee4c08f37c3a62fedc87fbd1b8b96ff4.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@v4

      # node:sqlite for scripts/verify-portal-backup.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install rclone (pinned, checksum-verified)
        # Not RCLONE_*: rclone reads every RCLONE_<FLAG> variable as a flag
        # (RCLONE_VERSION became --version and crashed it).
        env:
          PINNED_RCLONE: v1.75.2
          PINNED_RCLONE_ZIP_SHA256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
        run: |
          set -euo pipefail
          zip="rclone-${PINNED_RCLONE}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/${PINNED_RCLONE}/${zip}"
          echo "${PINNED_RCLONE_ZIP_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}"
          sudo install -m 0755 "rclone-${PINNED_RCLONE}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Copy R2 buckets to B2
        run: |
          set -euo pipefail
          # binding (B2 folder) = R2 bucket, matching storage-failover.ts layout
          while read -r folder bucket; do
            rclone copy "r2:${bucket}" "b2:${B2_BUCKET}/r2/${folder}" \
              --checksum --transfers 8 --stats-one-line --stats 60s
          done <<'EOF'
          club_files members-portal-reimagined-club-files
          blog_images members-portal-reimagined-blog-images
          case_studies members-portal-reimagined-case-studies
          gallery_cdn members-portal-reimagined-gallery
          EOF

      - name: Export D1 databases to B2 (portal export verified before upload)
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          manifest="manifest-${stamp}.txt"
          echo "# 180DC backup manifest ${stamp} (sha256 of uploaded objects; counts only, no member data)" > "$manifest"
          for db in 180dc-portal-db members-portal-reimagined-db members-portal-reimagined-newsletter; do
            npx --yes wrangler@4.151.0 d1 export "$db" --remote --output "${db}.sql"
            if [ "$db" = 180dc-portal-db ]; then
              # Restores the export into in-memory SQLite: integrity_check, foreign keys,
              # required tables. A failed check stops the job before upload.
              # Assign first: a failure inside echo "$(...)" would not stop the job.
              verified=$(node scripts/verify-portal-backup.mjs "${db}.sql")
              echo "verify ${db} ${verified}" >> "$manifest"
            fi
            gzip -9 "${db}.sql"
            rclone copyto "${db}.sql.gz" "b2:${B2_BUCKET}/d1/${db}/${stamp}.sql.gz"
            echo "sha256 $(sha256sum "${db}.sql.gz" | cut -d' ' -f1) d1/${db}/${stamp}.sql.gz" >> "$manifest"
          done
          for folder in club_files blog_images case_studies gallery_cdn; do
            echo "size r2/${folder} $(rclone size "b2:${B2_BUCKET}/r2/${folder}" --json)" >> "$manifest"
          done
          rclone copyto "$manifest" "b2:${B2_BUCKET}/manifests/${stamp}.txt"
          cat "$manifest"

      # Issues are disabled on this repository; GitHub emails the failed
      # scheduled run to the workflow's owner, and the summary names the cause.
      - name: Failure summary
        if: failure()
        run: |
          echo "::error::Backup to Backblaze B2 failed; see docs/operations/BACKUP_B2.md"
          echo "### Backup failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No complete backup was recorded for this run. Check the failed step above, then re-run the workflow." >> "$GITHUB_STEP_SUMMARY"
