name: Backup to Backblaze B2

# Uses `rclone copy` (never `sync`) so objects written to B2 during an R2
# outage are not deleted.

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

concurrency:
  group: b2-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == '180DC-VIT-CHENNAI/members-portal-reimagined'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ee4c08f37c3a62fedc87fbd1b8b96ff4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://ee4c08f37c3a62fedc87fbd1b8b96ff4.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_B2_TYPE: s3
      RCLONE_CONFIG_B2_PROVIDER: Other
      RCLONE_CONFIG_B2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      RCLONE_CONFIG_B2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      RCLONE_CONFIG_B2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Copy R2 buckets to B2
        run: |
          set -euo pipefail
          # binding (B2 folder) = R2 bucket, matching storage-failover.ts layout
          while read -r folder bucket; do
            rclone copy "r2:${bucket}" "b2:${B2_BUCKET}/r2/${folder}" \
              --checksum --transfers 8 --stats-one-line --stats 60s
          done <<'EOF'
          club_files members-portal-reimagined-club-files
          blog_images members-portal-reimagined-blog-images
          case_studies members-portal-reimagined-case-studies
          gallery_cdn members-portal-reimagined-gallery
          EOF

      - name: Export D1 databases to B2
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          for db in members-portal-reimagined-db members-portal-reimagined-newsletter; do
            npx --yes wrangler@4 d1 export "$db" --remote --output "${db}.sql"
            gzip -9 "${db}.sql"
            rclone copyto "${db}.sql.gz" "b2:${B2_BUCKET}/d1/${db}/${stamp}.sql.gz"
          done
