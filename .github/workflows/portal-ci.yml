name: Portal CI

# Checks every portal PR; on main it also deploys the `180dc-portal` Worker with
# `void deploy` once the repo variable PORTAL_DEPLOY is set to `enabled`.
# Deploy needs the secrets PORTAL_CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# void.lock.json must match what `void deploy` resolves: commit it whenever
# bindings in void.config.ts change (`void prepare` regenerates it).

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/portal-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/portal-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  # Never cancel a deploy half-way; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values; no real Google sign-in happens in CI.
      AUTH_GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
      AUTH_GOOGLE_CLIENT_SECRET: ci-secret
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm test:e2e

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PORTAL_DEPLOY == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: portal-production
      url: ${{ vars.PORTAL_URL }}
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Deploy (applies D1 migrations, verifies readiness, rolls back on failure)
        run: pnpm exec void deploy --platform cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Readiness is checked on the new version's preview URL before activation.
          CLOUDFLARE_WORKERS_SUBDOMAIN: srijan-guchhait
      - name: Resource IDs must already be committed
        run: git diff --exit-code -- void.lock.json
