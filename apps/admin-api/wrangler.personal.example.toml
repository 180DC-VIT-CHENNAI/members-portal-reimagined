# Copy to wrangler.personal.toml and supply resource IDs from your own account.
# Do not deploy this example or reuse the club resource IDs.
name = "180dc-personal-api"
main = "./index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "180dc-personal-db"
database_id = "REPLACE_WITH_PERSONAL_D1_ID"

[[d1_databases]]
binding = "NEWSLETTER_DB"
database_name = "180dc-personal-newsletters"
database_id = "REPLACE_WITH_PERSONAL_NEWSLETTER_D1_ID"

[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "REPLACE_WITH_PERSONAL_KV_ID"

[[r2_buckets]]
binding = "CLUB_FILES"
bucket_name = "180dc-personal-files"

[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "180dc-personal-blog-images"

[[r2_buckets]]
binding = "CASE_STUDIES"
bucket_name = "180dc-personal-case-studies"

[[r2_buckets]]
binding = "GALLERY_CDN"
bucket_name = "180dc-personal-gallery"

[vars]
ENVIRONMENT = "production"
ALLOWED_WEB_ORIGINS = "https://REPLACE_WITH_PERSONAL_PAGES_HOST.pages.dev"
NEWSLETTER_SITE_URL = ""

# Enable the email cron only after personal sender configuration and test delivery.
# [triggers]
# crons = ["* * * * *"]
# QUEUE is unused by the runtime and intentionally omitted.
# Configure auth/mail secrets separately with wrangler secret put --config wrangler.personal.toml.
